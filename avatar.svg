<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#78350f" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#coffeeGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#fef3c7" stroke-width="3" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- Coffee Cup Illustration -->
  <!-- Steam lines -->
  <path d="M85 55 Q90 42 85 34" fill="none" stroke="#fef3c7" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M100 52 Q106 38 100 28" fill="none" stroke="#fef3c7" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
  <path d="M115 55 Q120 42 115 34" fill="none" stroke="#fef3c7" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Cup Body -->
  <path d="M60 70 L140 70 C140 115 125 135 100 135 C75 135 60 115 60 70 Z" fill="#fffbeb"/>
  
  <!-- Cup Handle -->
  <path d="M136 78 C155 80 155 110 134 114" fill="none" stroke="#fffbeb" stroke-width="8" stroke-linecap="round"/>

  <!-- Coffee Liquid surface -->
  <ellipse cx="100" cy="74" rx="35" ry="8" fill="#92400e"/>
  
  <!-- Coffee Bean icon inside cup -->
  <ellipse cx="100" cy="98" rx="14" ry="19" fill="#b45309" transform="rotate(-15 100 98)"/>
  <path d="M100 81 Q95 98 103 115" fill="none" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Saucer Plate -->
  <path d="M50 142 Q100 152 150 142" fill="none" stroke="#fffbeb" stroke-width="7" stroke-linecap="round"/>

  <!-- Text / Badge RN -->
  <rect x="76" y="152" width="48" height="20" rx="10" fill="#fef3c7"/>
  <text x="100" y="166" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#78350f" letter-spacing="1.5">UMKM</text>
</svg>
